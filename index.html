<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Татьяна Солнечная - Раскрытие женской силы | Пробуждение сексуальной энергии</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --deep-burgundy: #8B4352;
            --vibrant-pink: #D46A6A;
            --soft-pink: #F8C8C8;
            --cream: #FFF8F0;
            --light-gold: #F5E6C8;
            --dark-text: #4A4A4A;
            --purple-mystic: #8B6B9E;
            --peach-blossom: #FFB7B2;
            --lavender: #E6E6FA;
            --moonlight: #F0E6FF;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--dark-text);
            background-color: var(--cream);
            overflow-x: hidden;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        /* Header */
        header {
            background: linear-gradient(135deg, var(--deep-burgundy) 0%, var(--purple-mystic) 100%);
            color: white;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--light-gold);
        }
        .nav-links {
            display: flex;
            list-style: none;
        }
        .nav-links li {
            margin-left: 2rem;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .nav-links a:hover {
            color: var(--light-gold);
        }
        
        /* Main */
        main {
            margin-top: 80px;
            padding: 2rem 0;
        }
        
        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--moonlight) 0%, var(--lavender) 100%);
            padding: 4rem 0;
            text-align: center;
            border-radius: 20px;
            margin: 2rem 0;
            box-shadow: 0 10px 30px rgba(139, 67, 82, 0.1);
        }
        
        .hero h1 {
            font-size: 3rem;
            color: var(--deep-burgundy);
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .hero img {
            max-width: 300px;
            border-radius: 50%;
            margin: 2rem 0;
            box-shadow: 0 10px 25px rgba(139, 67, 82, 0.2);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="nav-container">
                <div class="logo">Татьяна Солнечная</div>
                <nav>
                    <ul class="nav-links">
                        <li><a href="#about">О себе</a></li>
                        <li><a href="#services">Услуги</a></li>
                        <li><a href="#contact">Контакты</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container">
            <section class="hero">
                <h1>Татьяна Солнечная</h1>
                <img src="photo_2025-10-02_17-29-50.jpg" alt="Фото Татьяны Солнечной" />
                <p>Раскрытие женской силы | Пробуждение сексуальной энергии</p>
            </section>
        </div>
    </main>
</body>
</html>
